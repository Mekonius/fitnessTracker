name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test "tests/*.test.mjs"
      - name: Build-placeholder findes (ellers fejler deploy)
        run: grep -q '<meta name="build" content="__BUILD__"/>' index.html
