name: Deploy
on:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pak zip ud (uanset navn) og commit
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "Fandt zip: $ZIP - pakker ud..."
            unzip -o "$ZIP"
            rm -f "$ZIP"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "Udpak og deploy $ZIP" || echo "Intet at committe"
            git push
          else
            echo "Ingen zip - deployer eksisterende filer"
          fi

      - uses: actions/configure-pages@v4

      - name: Saml site-mappe (uden git/zip)
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='*.zip' --exclude='tests' ./ _site/

      - name: Stempl build-id (så appen kan se at der er en ny version)
        run: |
          printf '%s' "$GITHUB_SHA" > _site/version.txt
          sed -i 's|<meta name="build" content="__BUILD__"/>|<meta name="build" content="'"$GITHUB_SHA"'"/>|' _site/index.html
          grep -q "<meta name=\"build\" content=\"$GITHUB_SHA\"/>" _site/index.html || { echo "build-id blev ikke stemplet"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
